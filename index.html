<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Maddie ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
height:100vh;
overflow:hidden;
background:linear-gradient(135deg,#ffc0cb,#ff4f81);
display:flex;
justify-content:center;
align-items:center;
color:white;
text-align:center;
position:relative;
transition:all 1s ease;
}

.container{
z-index:5;
max-width:520px;
padding:20px;
}

.bear{
font-size:60px;
animation:bounce 2s infinite;
}
@keyframes bounce{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-18px);}
}

h1{
font-family:'Dancing Script',cursive;
font-size:46px;
margin:15px 0;
}

.subtitle{font-style:italic;margin-bottom:20px;}
.closing{margin-top:20px;font-weight:300;}

.buttons{
margin-top:30px;
display:flex;
justify-content:center;
gap:40px;
flex-wrap:wrap;
}

button{
cursor:pointer;
border:none;
padding:15px 30px;
border-radius:50px;
font-size:18px;
transition:0.3s;
}

.yes{
background:linear-gradient(45deg,#ff0000,#ff4d4d);
color:white;
font-size:22px;
box-shadow:0 0 30px rgba(255,0,0,0.7);
}
.yes:hover{transform:scale(1.12);}

.no{
background:white;
color:red;
border:2px solid red;
position:relative;
}

/* Floating Hearts */
.heart{
position:fixed;
bottom:-50px;
animation:floatUp linear forwards;
opacity:0.8;
}
@keyframes floatUp{
0%{transform:translateY(0);opacity:0;}
10%{opacity:1;}
100%{transform:translateY(-110vh);opacity:0;}
}

/* Celebration Screen */
.celebration{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:radial-gradient(circle,#ff4f81,#ff1493);
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:20;
padding:20px;
overflow:auto;
}

.celebration h2{
font-size:70px;
font-family:'Dancing Script',cursive;
animation:pulse 1s infinite;
}
@keyframes pulse{
0%,100%{transform:scale(1);}
50%{transform:scale(1.25);}
}

.spin{
font-size:60px;
animation:spin 2s linear infinite;
}
@keyframes spin{
from{transform:rotate(0);}
to{transform:rotate(360deg);}
}

.future-img{
width:250px;
height:250px;
object-fit:cover;
border-radius:20px;
margin-top:25px;
box-shadow:0 0 30px white;
animation:fadeIn 1.5s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:scale(0.9);}
to{opacity:1;transform:scale(1);}
}

.confetti{
position:fixed;
width:8px;
height:14px;
opacity:0.9;
animation:confettiFall linear forwards;
}
@keyframes confettiFall{
0%{transform:translate(0,0) rotate(0);}
100%{transform:translate(var(--x),100vh) rotate(720deg);}
}

.firework{
position:fixed;
width:6px;
height:6px;
border-radius:50%;
background:white;
animation:explode 1s ease-out forwards;
}
@keyframes explode{
from{opacity:1;}
to{transform:translate(var(--dx),var(--dy));opacity:0;}
}

</style>
</head>

<body>

<div class="container" id="mainContent">

<div class="bear">🧸</div>

<h1 id="typedText"></h1>

<p class="subtitle">I've been gathering courage to ask you this...</p>

<div class="buttons">
<button class="yes" id="yesBtn">Yes ❤️</button>
<button class="no" id="noBtn">No</button>
</div>

<p class="closing">Every love story is beautiful, but ours is my favourite</p>

</div>

<div class="celebration" id="celebration">
<h2>Yayyy!!</h2>
<div class="spin">💖</div>
<p style="margin-top:20px;font-size:22px;">I knew you'd say yes...</p>

<p style="margin-top:30px;font-size:26px;font-family:'Dancing Script',cursive;">
This will be us in the future ❤️
</p>

<img src="https://i.ibb.co/xKDZ2MPz/file-00000000a8d87209b17fba2671e66bc9.png" class="future-img" alt="Future Us">

</div>

<script>

/* Typing Effect */
const text="Will You Be My Valentine, Maddie?";
let i=0;
function type(){
if(i<text.length){
document.getElementById("typedText").innerHTML+=text.charAt(i);
i++;
setTimeout(type,60);
}
}
type();

/* Floating Hearts */
let heartInterval=setInterval(()=>{
const heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(Math.random()*20+20)+"px";
heart.style.animationDuration=(Math.random()*3+4)+"s";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),7000);
},500);

/* No Button Escape */
const noBtn=document.getElementById("noBtn");
const yesBtn=document.getElementById("yesBtn");
let messages=["Nope, not an option!","Try again!","You sure about that?","Not happening!","Think again!"];
let msgIndex=0;

function moveNo(){
const yesRect=yesBtn.getBoundingClientRect();
let x,y;
do{
x=Math.random()*(window.innerWidth-120);
y=Math.random()*(window.innerHeight-60);
}while(
x<yesRect.right+30 &&
x+120>yesRect.left-30 &&
y<yesRect.bottom+30 &&
y+60>yesRect.top-30
);
noBtn.style.position="fixed";
noBtn.style.left=x+"px";
noBtn.style.top=y+"px";
noBtn.textContent=messages[msgIndex];
msgIndex=(msgIndex+1)%messages.length;
}
noBtn.addEventListener("click",moveNo);
noBtn.addEventListener("touchstart",moveNo);

/* YES CLICK */
yesBtn.addEventListener("click",()=>{
document.getElementById("mainContent").style.display="none";
clearInterval(heartInterval);
document.getElementById("celebration").style.display="flex";
confetti();
fireworks();
});

function confetti(){
for(let i=0;i<160;i++){
const c=document.createElement("div");
c.className="confetti";
c.style.left="50%";
c.style.top="50%";
c.style.backgroundColor=`hsl(${Math.random()*360},100%,50%)`;
c.style.setProperty("--x",(Math.random()*600-300)+"px");
c.style.animationDuration=(Math.random()*2+2)+"s";
document.body.appendChild(c);
setTimeout(()=>c.remove(),4000);
}
}

function fireworks(){
for(let i=0;i<80;i++){
const f=document.createElement("div");
f.className="firework";
f.style.left="50%";
f.style.top="40%";
f.style.backgroundColor=`hsl(${Math.random()*360},100%,50%)`;
f.style.setProperty("--dx",(Math.random()*400-200)+"px");
f.style.setProperty("--dy",(Math.random()*400-200)+"px");
document.body.appendChild(f);
setTimeout(()=>f.remove(),1000);
}
}

</script>

</body>
</html>
